<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knock Knock — Emerald Mobile Light List</title>
    <link rel="stylesheet" href="emerald-mobile-light.css">
</head>
<body>

<div class="background"></div>

<div class="phone">

    <header class="header">
        <h1>Messages</h1>
    </header>

    <nav class="tabs glass">
        <button class="active">ALL</button>
        <button>GROUPS</button>
        <button>DIRECTS</button>
        <button>CHANNELS</button>
    </nav>

    <main class="chat-list">

        <article class="chat glass">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150" alt="EV">
                <span class="online"></span>
            </div>
            <div class="content">
                <h3>Eleanor Vance</h3>
                <p>Hey, the manuscript is ready...</p>
            </div>
            <div class="meta">
                <span>11:28 AM</span>
                <div class="badge">1</div>
            </div>
        </article>

        <article class="chat glass">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150" alt="AP">
            </div>
            <div class="content">
                <h3>Arthur Pendelton</h3>
                <p><span>Juno:</span> Meeting at the gallery?</p>
            </div>
            <div class="meta">
                <span>11:15 AM</span>
            </div>
        </article>

        <article class="chat glass">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="SC">
                <span class="online"></span>
            </div>
            <div class="content">
                <h3>Seraphina Croft</h3>
                <p>Did you check the new invite?</p>
            </div>
            <div class="meta">
                <span>10:55 AM</span>
                <div class="badge">2</div>
            </div>
        </article>

        <article class="chat glass">
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?w=150" alt="MA">
            </div>
            <div class="content">
                <h3>Marcus Aurelius</h3>
                <p><span>Kael:</span> Secure the node now!</p>
            </div>
            <div class="meta">
                <span>10:30 AM</span>
            </div>
        </article>

    </main>

    <!-- Обертка навбара с выемкой и кнопкой -->
    <div class="nav-container">
        
        <button class="new-chat">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <footer class="bottom glass">
            <div class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>Chats</span>
            </div>

            <div class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>Contacts</span>
            </div>

            <!-- Центральный плейсхолдер под выемкой -->
            <div class="nav-center-placeholder">
                <span>CREATE</span>
            </div>

            <div class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <span>Search</span>
            </div>

            <div class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Profile</span>
            </div>
        </footer>

    </div>

</div>

</body>
</html>
