services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    pull_policy: if_not_present
    container_name: whoami-pb
    restart: unless-stopped
    command: 
      - serve 
      - --http=0.0.0.0:8090 
      - --dir=/pb/pb_data 
      - --hooksDir=/pb/pb_hooks
    ports:
      - "8090:8090"
    volumes:
      - /home/alex/whoami-bd/pb_data:/pb/pb_data
      - ../home/pb_hooks:/pb/pb_hooks
      - ../home/pb_schema.json:/pb/pb_schema.json
    env_file:
      - ../../app/.env
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-}
      - PB_SMTP_HOST=${PB_SMTP_HOST:-}
      - PB_SMTP_PORT=${PB_SMTP_PORT:-}
      - PB_SMTP_USER=${PB_SMTP_USER:-}
      - PB_SMTP_PASS=${PB_SMTP_PASS:-}
      - PB_SMTP_TLS=${PB_SMTP_TLS:-true}
      - PB_PUSH_GATEWAY_URL=http://whoami-push:4000
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8090 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default

  web:
    image: ghcr.io/stonek79/knock-knock-app:latest
    container_name: whoami-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - default

networks:
  default:
    name: whoami-net
    external: true
