services:
  minio:
    # The Quay tag from the old MinIO example was removed.  Keep a concrete
    # Docker Hub tag so deployments do not silently change on every pull.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: nemo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    volumes:
      - /home/alex/nemo-data/minio:/data
    ports:
      # Доступен только локально: FRP-клиент работает в host network.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - whoami-net

networks:
  whoami-net:
    external: true
