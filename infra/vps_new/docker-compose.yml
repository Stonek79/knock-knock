services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel-vps
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_VPS_TOKEN}
    networks:
      - whoami-net
    restart: unless-stopped

  push-gateway:
    build: ./push-gateway
    container_name: whoami-push
    restart: unless-stopped
    # Порты наружу не пробрасываем, Cloudflare Tunnel будет проксировать трафик внутрь
    environment:
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
    env_file:
      - .env
    networks:
      - whoami-net

networks:
  whoami-net:
    name: whoami-net
