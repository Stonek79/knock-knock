services:
  nginx:
    image: nginx:alpine
    container_name: whoami-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - whoami-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frps
      - pocketbase
      - web

  web:
    image: ghcr.io/nemolabs/nemo-app:latest
    container_name: whoami-web
    restart: unless-stopped
    networks:
      - whoami-net

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    pull_policy: if_not_present
    container_name: whoami-pb
    restart: unless-stopped
    command: 
      - serve 
      - --http=0.0.0.0:8090 
      - --dir=/pb/pb_data 
      - --hooksDir=/pb/pb_hooks
    volumes:
      - /opt/nemo/pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_schema.json:/pb/pb_schema.json
    env_file:
      - .env
    environment:
      - PB_ENCRYPTION_KEY=${PB_ENCRYPTION_KEY:-}
      - PB_PUSH_GATEWAY_URL=http://whoami-push:4000/
      # В Prod-режиме письмо отправляется через реальный SMTP (Mailgun/Resend)
      - PB_SMTP_HOST=${PB_SMTP_HOST:-}
      - PB_SMTP_PORT=${PB_SMTP_PORT:-}
      - PB_SMTP_USER=${PB_SMTP_USER:-}
      - PB_SMTP_PASS=${PB_SMTP_PASS:-}
      - PB_SMTP_TLS=${PB_SMTP_TLS:-true}
    networks:
      - whoami-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frps:
    image: fatedier/frps:v0.58.1
    container_name: whoami-frps
    restart: unless-stopped
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "7443:7443" # Внешний порт для FRP туннеля
      - "6000:6000" # Безопасный SSH доступ к домашнему серверу
      - "127.0.0.1:19000:19000" # MinIO S3 через FRP, только локально на VPS
    volumes:
      - ./frps.toml:/etc/frp/frps.toml
    env_file:
      - .env
    networks:
      - whoami-net

  push-gateway:
    build: ./push-gateway
    container_name: whoami-push
    restart: unless-stopped
    environment:
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    env_file:
      - .env
    networks:
      - whoami-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    container_name: whoami-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml

networks:
  whoami-net:
    name: whoami-net
