services:
  nginx:
    image: nginx:alpine
    container_name: whoami-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - whoami-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frps

  frps:
    image: fatedier/frps:v0.58.1
    container_name: whoami-frps
    restart: unless-stopped
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "7443:7443" # Внешний порт для FRP туннеля
      - "3000:3000" # Веб-интерфейс React App
      - "8090:8090" # PocketBase Prod API
      - "9090:9090" # PocketBase Dev API
      - "6000:6000" # Безопасный SSH доступ к домашнему серверу
    volumes:
      - ./frp/frps.toml:/etc/frp/frps.toml
    env_file:
      - .env
    networks:
      - whoami-net

  push-gateway:
    build: ./push-gateway
    container_name: whoami-push
    restart: unless-stopped
    # Порты наружу не пробрасываем, Cloudflare Tunnel будет проксировать трафик внутрь
    environment:
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    env_file:
      - .env
    networks:
      - whoami-net

  livekit:
    image: livekit/livekit-server:latest
    container_name: whoami-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml

networks:
  whoami-net:
    name: whoami-net
