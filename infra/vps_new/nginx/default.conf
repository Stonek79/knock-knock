# --------------------------------------------------------------------------
# S2S rate-limit зона для защищённого маршрута /push/
# Убрать после переноса Prod PocketBase на VPS вместе с location /push/
# --------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=push_gateway:1m rate=240r/m;


server {
    listen 80;
    server_name whoami.ninja api.whoami.ninja dev-api.whoami.ninja;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name whoami.ninja;

    ssl_certificate /etc/letsencrypt/live/api.whoami.ninja/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.whoami.ninja/privkey.pem;

    location / {
        proxy_pass http://whoami-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location /livekit/ {
        proxy_pass http://host.docker.internal:7880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name api.whoami.ninja;

    ssl_certificate /etc/letsencrypt/live/api.whoami.ninja/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.whoami.ninja/privkey.pem;

    location / {
        proxy_pass http://whoami-pb:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /api/realtime {
        proxy_pass http://whoami-pb:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "keep-alive";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /push/ {
        # S2S-транспорт для домашнего PocketBase → gateway на VPS.
        # Браузерные запросы без внутреннего секрета отклоняются здесь.
        # Удалить после переноса Prod PocketBase на VPS.
        if ($http_authorization = "") { return 403; }
        limit_req zone=push_gateway burst=30 nodelay;
        client_max_body_size 64k;
        proxy_pass http://whoami-push:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /livekit/ {
        proxy_pass http://host.docker.internal:7880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400s;
    }
}

