server {
    listen 80;
    server_name dev-api.whoami.ninja;
    return 301 https://$host:8443$request_uri;
}

map $http_upgrade $connection_upgrade_dev {
    default upgrade;
    ''      keep-alive;
}

server {
    listen 8443 ssl;
    server_name dev-api.whoami.ninja;

    ssl_certificate /etc/letsencrypt/live/dev-api.whoami.ninja/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.whoami.ninja/privkey.pem;

    # Все запросы (API, Realtime и статика) идут напрямую в FRP
    location / {
        # CORS Headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apikey,x-client-info,prefer' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Проксируем трафик DEV-базы через чистый WireGuard туннель напрямую домой!
        proxy_pass http://10.88.0.2:9090; 
        
        # Заголовки для WebSockets и SSE (динамически!)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_dev;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PocketBase Realtime требует отключения буферизации
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Эндпоинт для Push-Gateway DEV (при необходимости)
    location /push/ {
        proxy_pass http://whoami-push:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
