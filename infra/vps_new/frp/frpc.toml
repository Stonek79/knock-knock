serverAddr = "149.33.42.8"
serverPort = 7443

[auth]
method = "token"
token = "{{ .Envs.FRP_TOKEN }}"

[transport]
# Пул предварительных work connections — без него каждый параллельный
# запрос браузера требует нового round-trip для создания соединения,
# что вызывает 502 при загрузке ассетов
poolCount = 10
tcpMux = true
tcpMuxKeepaliveInterval = 10
heartbeatInterval = 10
heartbeatTimeout = 30

[log]
level = "trace"

[[proxies]]
name = "pocketbase_prod"
type = "tcp"
localIP = "whoami-pb"
localPort = 8090
remotePort = 8090

[[proxies]]
name = "pocketbase_dev"
type = "tcp"
localIP = "whoami-pb-dev"
localPort = 8090
remotePort = 9090
