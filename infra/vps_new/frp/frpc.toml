serverAddr = "149.33.42.8"
serverPort = 7443

[auth]
method = "token"
token = "{{ .Envs.FRP_TOKEN }}"

[transport]
# WebSocket-транспорт: выглядит как обычный веб-трафик для ISP/DPI,
# имеет собственное фреймирование (решает проблемы с фрагментацией)
protocol = "websocket"
# Пул предварительных work connections для параллельных запросов браузера
poolCount = 3
tcpMux = true
tcpMuxKeepaliveInterval = 10
heartbeatInterval = 10
heartbeatTimeout = 30

[log]
level = "trace"

[[proxies]]
name = "pocketbase_prod"
type = "tcp"
localIP = "whoami-pb"
localPort = 8090
remotePort = 8090

[[proxies]]
name = "pocketbase_dev"
type = "tcp"
localIP = "whoami-pb-dev"
localPort = 8090
remotePort = 9090
