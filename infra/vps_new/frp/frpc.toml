serverAddr = "149.33.42.8"
serverPort = 7443

[log]
level = "trace"

auth.method = "token"
auth.token = "12345678"

[transport]
# Оборачиваем туннель в чистый TLS для маскировки от ТСПУ
tls.enable = false
# КРИТИЧЕСКИ ВАЖНО: отключаем склейку трафика (Yamux). Теперь для каждого файла будет открываться свой TCP поток.
tcpMux = false

[[proxies]]
name = "pocketbase_prod"
type = "tcp"
localIP = "whoami-pb"
localPort = 8090
remotePort = 8090

[[proxies]]
name = "pocketbase_dev"
type = "tcp"
localIP = "whoami-pb-dev"
localPort = 8090
remotePort = 9090
