# ==============================================================================
# КНОК-КНОК: КОНФИГУРАЦИЯ КЛИЕНТА ТУННЕЛЯ (FRPC) ДЛЯ ДОМАШНЕГО СЕРВЕРА
# ==============================================================================
# Этот файл отвечает за связывание сервисов домашнего сервера с VPS "Ninja".
# Работает в изолированном контейнере whoami-frpc (infra/tunnel/docker-compose.yml)
# ==============================================================================

# Отключаем аварийный выход при задержках первичного подключения
loginFailExit = false

# Адрес и порт серверного туннеля FRPS на VPS
serverAddr = "whoami.ninja"
serverPort = 7443

# Авторизация по мастер-токену из файла app/.env (FRP_TOKEN)
[auth]
method = "token"
token = "{{ .Envs.FRP_TOKEN }}"

# Настройки шифрования, TLS-соединения и поддержания пульса (Heartbeat)
[transport]
tcpMux = true
tls.enable = true
dialServerTimeout = 30
dialServerKeepAlive = 30
heartbeatInterval = 10
heartbeatTimeout = 30

[log]
level = "info"

# ------------------------------------------------------------------------------
# ПРОКСИ-МАРШРУТЫ (Перенаправление трафика с VPS на домашний сервер)
# ------------------------------------------------------------------------------

# 1. Веб-интерфейс приложения (React App)
[[proxies]]
name = "whoami_web"
type = "tcp"
localIP = "127.0.0.1"
localPort = 3000
remotePort = 3000

# 2. Продакшен база данных (PocketBase Prod API)
[[proxies]]
name = "whoami_pb"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8090
remotePort = 8090

# 3. База данных для разработки (PocketBase Dev API)
[[proxies]]
name = "whoami_pb_dev"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9090
remotePort = 9090

# 4. Безопасный SSH-доступ к домашнему серверу из любой точки мира
[[proxies]]
name = "ssh_home"
type = "tcp"
localIP = "host.docker.internal"
localPort = 22
remotePort = 6000
