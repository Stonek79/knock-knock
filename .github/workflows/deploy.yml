name: Deploy to Home Server

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stonek79/knock-knock-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          VAPID_PUB_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_VAPID_PUBLIC_KEY=${{ env.VAPID_PUB_KEY }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Pull and Restart App AND PocketBase infrastructure
        run: |
          cd ~/knock-knock
          git pull origin main
          
          # Гарантируем наличие сети whoami-net на домашнем сервере
          docker network create --opt com.docker.network.driver.mtu=1300 whoami-net 2>/dev/null || true
          
          # Останавливаем старые разрозненные контейнеры (если они есть)
          docker rm -f whoami-web whoami-frpc || true
          
          # Запускаем/Обновляем инфраструктуру Домашнего сервера с повторными попытками при сетевых таймаутах
          for i in 1 2 3; do docker compose -f infra/prod/docker-compose.yml pull && break || (echo "Retry $i failed, retrying in 5s..." && sleep 5); done
          docker compose -f infra/prod/docker-compose.yml up -d --remove-orphans
